<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Listado de Mesas</h3>
    <a routerLink="/home/registrar-mesa" class="btn btn-success">
      <i class="fas fa-plus-circle me-2"></i>Registrar Mesa
    </a>
  </div>

  <table class="table table-bordered table-hover mt-3">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Número</th>
        <th>Capacidad</th>
        <th>Ubicación</th>
        <th>Estado</th>
        <th>Acciones</th> 
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let mesa of mesas">
        <td>{{ mesa.idMesa }}</td>
        <td>{{ mesa.numero }}</td>
        <td>{{ mesa.capacidad }}</td>
        <td>{{ mesa.ubicacion }}</td>
        <td>{{ mesa.estadoMesa.descripcion }}</td>
        <td>
  <a [routerLink]="['/home/actualizar-mesa', mesa.idMesa]" class="btn btn-sm btn-outline-primary me-2">
    <i class="fas fa-edit"></i> Editar
  </a>
  <a (click)="eliminar(mesa.idMesa!)" class="btn btn-sm btn-outline-danger">
  <i class="fas fa-trash"></i> Eliminar
</a>

</td>
      </tr>
    </tbody>
  </table>
</div>
