<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>
      <i class="fas fa-clipboard-list me-2 text-primary"></i>Listado de Estados de Mesa
    </h3>
    <!-- Botón Registrar -->
    <a class="btn btn-success" routerLink="/home/registrar-estado-mesa">
      <i class="fas fa-plus-circle me-1"></i>Registrar Estado
    </a>
  </div>

  <!-- Mensaje si no hay datos -->
  <div *ngIf="estados.length === 0" class="alert alert-info text-center">
    No hay estados registrados.
  </div>

  <!-- Lista de estados -->
  <div class="row">
    <div class="col-md-6" *ngFor="let estado of estados">
      <div class="card mb-3 shadow-sm border-start border-5 border-info">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h5 class="card-title mb-1">
              <i class="fas fa-info-circle text-info me-2"></i>{{ estado.descripcion }}
            </h5>
            <p class="card-text text-muted mb-0">ID: {{ estado.idEstMesa }}</p>
          </div>
          <!-- Botones -->
          <div>
            <a [routerLink]="['/home/actualizar-estado-mesa', estado.idEstMesa!]" class="btn btn-warning btn-sm me-2">
                <i class="fas fa-edit"></i>
            </a>
            <button class="btn btn-sm btn-danger" (click)="eliminar(estado.idEstMesa!)">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
