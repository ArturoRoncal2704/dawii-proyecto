<div class="container mt-4">
  <h3><i class="fas fa-edit me-2 text-primary"></i>Actualizar Estado de Mesa</h3>

  <form (ngSubmit)="actualizar()">
    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripción</label>
      <input
        type="text"
        id="descripcion"
        name="descripcion"
        class="form-control"
        [(ngModel)]="estadoMesa.descripcion"
        required>
    </div>

    <button type="submit" class="btn btn-primary">
      <i class="fas fa-save me-1"></i>Actualizar
    </button>
    <a routerLink="/home/estado-mesa" class="btn btn-secondary ms-2">Cancelar</a>
  </form>
</div>
