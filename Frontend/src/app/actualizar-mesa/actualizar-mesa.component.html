<div class="container mt-4">
  <h3>Actualizar Mesa</h3>

  <form (ngSubmit)="actualizar()">
    <div class="mb-3">
      <label class="form-label">Número</label>
      <input type="number" class="form-control" [(ngModel)]="mesa.numero" name="numero" required>
    </div>

      <div class="mb-3">
  <label class="form-label">Capacidad</label>
  <input type="number" class="form-control" [(ngModel)]="mesa.capacidad" name="capacidad" required min="1" max="6">
</div>

    <div class="mb-3">
      <label class="form-label">Ubicación</label>
      <input type="text" class="form-control" [(ngModel)]="mesa.ubicacion" name="ubicacion" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Estado</label>
      <select class="form-select" [(ngModel)]="mesa.estadoMesa.idEstMesa" name="estadoMesa" required>
        <option *ngFor="let estado of estados" [value]="estado.idEstMesa">
          {{ estado.descripcion }}
        </option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Actualizar Mesa</button>
  </form>
</div>
