name: db

services:
  mysql:
    image: mysql:latest
    container_name: mysql-dawii
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: superuser
    volumes:
      - mysql-data:/var/lib/mysql
      - ..\..\util\script\init-script.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - restaurant-net

volumes:
  mysql-data:
    driver: local

networks:
  restaurant-net:
    external: true